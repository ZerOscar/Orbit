name: Release

# 打 tag（如 v1.0.0）时自动构建单文件版并附到 Release 上。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: 打包 win-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: 发布单文件
        run: |
          dotnet publish src/Orbit.App/Orbit.App.csproj -c Release -r win-x64 `
            --source https://api.nuget.org/v3/index.json -o dist/win-x64

      - name: 压缩
        run: Compress-Archive -Path dist/win-x64/Orbit.exe -DestinationPath dist/Orbit-win-x64.zip -Force

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-win-x64
          path: dist/Orbit-win-x64.zip

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Orbit-win-x64.zip
          generate_release_notes: true
